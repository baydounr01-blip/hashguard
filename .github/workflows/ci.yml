name: hashguard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: "tests (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Test suite
        run: pytest -q

  zero-dependency-check:
    name: "the agent runs on the standard library alone"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with no optional extras
        run: pip install -e .
      - name: Confirm nothing third-party was pulled in
        run: |
          set -e
          installed=$(pip list --format=freeze --not-required \
            | grep -viE '^(hashguard|pip|setuptools|wheel)' || true)
          if [ -n "$installed" ]; then
            echo "Unexpected runtime dependencies:"; echo "$installed"; exit 1
          fi
          echo "No third-party runtime dependencies."
      - name: The agent must still start and seal without 'cryptography'
        run: |
          set -e
          mkdir -p /tmp/hg && cd /tmp/hg
          # -u matters: timeout stops the agent with SIGTERM, which does not
          # flush Python's block-buffered stdout when it is redirected to a
          # file. Without it the banner is written and then lost, and this step
          # fails for a reason that has nothing to do with the agent.
          timeout 25 python3 -u -m hashguard --demo > run.log 2>&1 || true
          # Echo the banner so a future failure here is diagnosable, with the
          # generated token redacted -- it is throwaway, but CI logs are not the
          # place to practise printing secrets.
          sed 's/^ *[A-Za-z0-9_-]\{32,\}$/           <token redacted>/' run.log
          grep -q "hmac-sha256" run.log
          grep -q "install 'cryptography'" run.log
          test -s ledger/records/*.jsonl
          echo "Degraded cleanly to HMAC and said so."

  end-to-end-verification:
    name: "an invoice verifies, and a tampered one does not"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Build a month, verify it, break it, watch the verifier catch it
        run: python3 scripts/demo_verification.py
