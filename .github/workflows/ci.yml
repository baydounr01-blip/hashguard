name: hashguard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: "tests (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Test suite
        run: pytest -q

  zero-dependency-check:
    name: "the agent runs on the standard library alone"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with no optional extras
        run: pip install -e .
      - name: Confirm nothing third-party was pulled in
        run: |
          set -e
          installed=$(pip list --format=freeze --not-required \
            | grep -viE '^(hashguard|pip|setuptools|wheel)' || true)
          if [ -n "$installed" ]; then
            echo "Unexpected runtime dependencies:"; echo "$installed"; exit 1
          fi
          echo "No third-party runtime dependencies."
      - name: The agent must still start and seal without 'cryptography'
        run: |
          set -e
          mkdir -p /tmp/hg && cd /tmp/hg
          # -u matters: timeout stops the agent with SIGTERM, which does not
          # flush Python's block-buffered stdout when it is redirected to a
          # file. Without it the banner is written and then lost, and this step
          # fails for a reason that has nothing to do with the agent.
          timeout 25 python3 -u -m hashguard --demo > run.log 2>&1 || true
          # Echo the banner so a future failure here is diagnosable, with the
          # generated token redacted -- it is throwaway, but CI logs are not the
          # place to practise printing secrets.
          sed 's/^ *[A-Za-z0-9_-]\{32,\}$/           <token redacted>/' run.log
          grep -q "hmac-sha256" run.log
          grep -q "install 'cryptography'" run.log
          test -s ledger/records/*.jsonl
          echo "Degraded cleanly to HMAC and said so."

  compat:
    name: "the published version and this one, over one ledger"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The round trip checks out the published version as a second git
          # worktree, so the whole history has to be here.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Round trip against v2.0.0
        run: bash tools/compat/roundtrip.sh

  self-audit:
    name: "the v1 findings, replayed against a running agent"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run an agent long enough to have a ledger, then audit it
        run: |
          set -e
          mkdir -p /tmp/hg-audit && cd /tmp/hg-audit
          # A fresh install has no records, and AUDIT-05 would report NOT
          # CHECKED rather than replay the tamper probe -- which is honest, and
          # useless as a gate. Poll fast for half a minute so the check that
          # matters most has a chain to break.
          echo '{"poll_seconds": 5}' > config.json
          timeout 32 python3 -u -m hashguard --demo > run.log 2>&1 || true
          records=$(cat ledger/records/*.jsonl | wc -l)
          echo "ledger holds $records records"
          test "$records" -ge 2
          # Stricter than --strict, and more useful: a check that could not
          # run fails the build unless it is the one amber line we already
          # know about by name. Today that is the release digest, which no tag
          # publishes yet. Anything else going amber -- a ledger that stopped
          # being readable, a web/ that moved -- is a regression in the audit's
          # own reach and must not pass quietly.
          set +e
          python3 -m hashguard --self-audit --json > audit.json
          code=$?
          set -e
          python3 - <<'PY'
          import json, sys
          report = json.load(open("audit.json"))
          for check in report["checks"]:
              print(f"{check['verdict']:<11} {check['finding']:<9} {check['claim']}")
              print(f"            {'':<9} . {check['observed']}")
          failed = [c["finding"] for c in report["checks"] if c["verdict"] == "FAIL"]
          amber = [c["finding"] for c in report["checks"] if c["verdict"] == "NOT CHECKED"]
          if failed:
              sys.exit(f"self-audit failed: {failed}")
          if set(amber) - {"build"}:
              sys.exit(f"a check could not run, and it is not the known one: {amber}")
          print(f"\nself-audit: {report['summary']}")
          PY
          exit $code

  end-to-end-verification:
    name: "an invoice verifies, and a tampered one does not"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: Build a month, verify it, break it, watch the verifier catch it
        run: python3 scripts/demo_verification.py
